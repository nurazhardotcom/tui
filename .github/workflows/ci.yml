name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.12.0.1530
          bb: 1.12.218
      - name: Parallel tests (attestation gate)
        run: clojure -M:test
      - name: Compile check
        run: clojure -M -e "(require 'tui.core 'tui.auth 'tui.zen 'tui.tools 'tui.stream) (println :compile-ok)"
      - name: License + secret hygiene
        run: |
          test -f LICENSE
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          ! grep -R "gho_" --include="*.clj" --include="*.edn" --include="*.sh" src test . || (echo "possible token leak" && exit 1)
